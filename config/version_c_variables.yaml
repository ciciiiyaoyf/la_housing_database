schema_version: 1
database_version: "C. Real-time monthly vintage"
config_version: housing_finance_version_c_v1
output_frequency: monthly
output_id_suffix: _monthly_rt
contract:
  description: >-
    Closed variable dictionary for the strict real-time Version C builder. Every
    observation is keyed by an as-of cutoff and a deterministic vintage ID, and
    no transformation may use a source availability date after that cutoff or a
    future interpolation endpoint.
  output_statuses:
    - canonical_modeled_carry
    - canonical_null
    - proxy
    - scenario
  canonical_null_policy: >-
    Required canonical targets without a method-compliant real-time input are
    materialized as explicit nulls. Proxies and sensitivities use separate IDs
    and never populate a canonical target.

variables:
  - variable_id: acs_estimated_aggregate_monthly_first_mortgage_pi_monthly_rt
    display_name: Estimated aggregate monthly first-mortgage P&I - real-time carry
    benchmark_variable_id: acs_estimated_aggregate_monthly_first_mortgage_pi_benchmark
    construction_anchor_variable_ids:
      - acs_estimated_aggregate_monthly_first_mortgage_pi_benchmark
    unit: USD/month
    output_status: canonical_modeled_carry
    canonical: true
    proxy: false
    scenario: false
    expected_value_policy: populated_when_eligible_anchor_available
    transformation_id: version_c_latest_payment_carry_v1
    methodological_notes: >-
      Carry the latest eligible Version A payment benchmark as a level. The
      word monthly is the payment-flow unit; this is not temporal interpolation.

  - variable_id: acs_first_mortgage_pi_per_mortgaged_unit_monthly_rt
    display_name: First-mortgage P&I per mortgaged unit - real-time carry
    benchmark_variable_id: acs_first_mortgage_pi_per_mortgaged_unit_benchmark
    construction_anchor_variable_ids: [acs_first_mortgage_pi_per_mortgaged_unit_benchmark]
    unit: USD/unit/month
    output_status: canonical_modeled_carry
    canonical: true
    proxy: false
    scenario: false
    expected_value_policy: populated_when_eligible_anchor_available
    transformation_id: version_c_latest_payment_carry_v1
    methodological_notes: Latest eligible structural per-unit payment control; no interpolation.

