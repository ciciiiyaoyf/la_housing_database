    construction_anchor_variable_ids:
      - hmda_aggregate_downpayment_flow_benchmark
    indicator_variable_ids: [homes_sold, median_sale_price]
    indicator_source_ids: [redfin_county_monthly]
    unit: USD
    output_status: proxy
    canonical: false
    proxy: true
    scenario: true
    expected_value_policy: populated_only_with_complete_finalized_year_proxy_weights_and_target_month_weight
    transformation_id: version_c_redfin_purchase_value_proxy_nowcast_v1
    methodological_notes: >-
      Uses homes sold times median sale price only as a purchase-value proxy.
      It excludes cash/finance mix and never populates the canonical flow ID.

