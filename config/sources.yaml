  provenance_status: official_raw_archive_rebuilt
  manual_reason: >-
    A signed-in HUD User personal access token in HUDUSER_API_TOKEN is required only
    when an authenticated official response is not already present in the verified
    local archive.
  methodology_notes: >-
    The source-specific downloader bypasses generic data/raw/<raw_subdir> routing and
    stores the licensed official archive under data/restricted/hud_usps/raw/. The
    vacancy proxy is (short-term vacant residential addresses + long-term vacant
    residential addresses) / total residential addresses. No-stat remains separate.
    Source component values are direct at standardized 2020-tract geography;
    California county values are constructed by summing complete tract components,
    and Los Angeles County postal-ZIP-part values are modeled with the fixed 2026 Q1
    tract-to-ZIP crosswalk. Postal ZIP county-parts are neither whole postal ZIPs nor
    Census ZCTAs. Keep the native quarterly frequency, do not expand values to
    observed months, and never label the proxy true rental-listing inventory.
  license_or_use_notes: >-
    Census-tract information and derivatives are confidential and proprietary under
    the HUD-USPS sublicense. Keep the raw archive and detailed derived outputs
    access-controlled, under data/restricted/hud_usps/, and outside Git history;
    preserve the required notice with every copy. Do not publish the licensed tract
    or modeled ZIP-part observations through public exports.
  revision_notes: >-
    Official raw archive verified 2026-08-03: 73 contiguous standardized-2020-tract
    NCWM JSON responses for 2008 Q1 through 2026 Q1, the official 2026 Q1
    tract-to-postal-ZIP crosswalk JSON response, and the official 58-row 2020 Census
    California county-code TXT reference. All 75 artifacts retain source URL/query,
    source filename, UTC retrieval timestamp, provider vintage or release date when
    supplied, geography, file size, and SHA-256 checksum. The former 2026-08-02
    derived package file was deleted; only its superseded quarantine manifest remains. USPS
    address-management changes can create longitudinal discontinuities that must
    remain visible.
