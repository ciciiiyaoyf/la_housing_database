  provenance_status: quarantined_derived_snapshot
  manual_reason: The surviving 2026-08-02 derived package lacks archived official quarterly API responses, the raw crosswalk response, exact UTC retrieval timestamps, source release dates, and raw checksums. Reacquire and archive official inputs before activation.
  methodology_notes: The vacancy proxy is (short-term vacant residential addresses + long-term vacant residential addresses) / total residential addresses. No-stat remains separate. Modeled ZIP values represent Los Angeles County portions of postal ZIPs using a fixed crosswalk and are neither whole postal ZIPs nor Census ZCTAs. Do not expand quarterly values to observed months or label the proxy true rental-listing inventory.
  license_or_use_notes: Census-tract information and derivatives are confidential and proprietary under the HUD-USPS sublicense. Keep licensed files access-controlled and outside Git history; preserve the required notice with every copy.
  revision_notes: Archive every authorized raw response and crosswalk vintage with source URL/query, source filename, UTC retrieval timestamp, provider vintage, geography, file size, and SHA-256 checksum. USPS address-management changes can create longitudinal discontinuities that must remain visible.
