  - source_id: redfin_zip_monthly
    provider: Redfin Data Center
    dataset_name: Housing Market Tracker ZIP Key Metrics, rolling three months
    source_page_url: https://www.redfin.com/news/data-center/downloads/
    download_url: https://www.redfin.com/news/data-center/downloads/
    native_frequency: rolling_3_months
    geography_levels: [postal_zip]
    file_format: csv
    enabled: true
    auto_download: false
    manual_reason: Redfin does not publish a verified stable direct endpoint for the user-selected ZIP Key Metrics CSV. Import the official Data Center download with --local-file.
    manual_filename: redfin_housing_market_monthly_all_zips_key_metrics_2019_Jan_to_2026_May.csv
    selected_start_date: "2019-01-01"
    selected_end_date: "2026-05-31"
    rolling_window_months: 3
    expected_columns:
      - LAST UPDATED
      - FREQUENCY
      - PERIOD BEGIN
      - PERIOD END
      - REGION ID
      - REGION TYPE
      - REGION NAME
      - METRO
      - HOMES SOLD
      - HOMES SOLD YOY (%)
      - MEDIAN SALE PRICE NSA ($)
      - MEDIAN SALE PRICE NSA YOY (%)
      - MEDIAN DAYS ON MARKET (DAYS)
      - MEDIAN DAYS ON MARKET YOY (%)
      - NEW LISTINGS
      - NEW LISTINGS YOY (%)
      - ACTIVE LISTINGS
      - ACTIVE LISTINGS YOY (%)
      - PENDING SALES
      - PENDING SALES YOY (%)
    methodology_notes: Key Metrics download dated by PERIOD END; every observation is an overlapping Rolling 3 Months window. Only ZIPs verified to primary county FIPS 06037 are loaded into clean analytics.
    license_or_use_notes: Official Redfin Data Center manual download; the complete national file remains immutable raw data and provider postal ZIPs are not Census ZCTAs.
    revision_notes: Historical values can be revised. Provider YoY percentages are retained as percentage points and active listings are not relabeled as inventory.
