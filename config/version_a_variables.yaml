  - {variable_id: hmda_aggregate_downpayment_flow_conventional_benchmark, display_name: HMDA aggregate down-payment flow - conventional benchmark, definition: Aggregate CLTV-implied down-payment dollars for conventional originations, provider: CFPB and FFIEC, original_field: property_value/combined_loan_to_value_ratio, unit: USD, native_frequency: annual, final_frequency: annual, geography: county, seasonal_adjustment: not seasonally adjusted, smoothing: none, transformation: direct annual loan-type aggregation, missing_value_policy: suppress below N=100, revision_policy: archive each official Modified LAR file, methodological_notes: loan_type=1.}
