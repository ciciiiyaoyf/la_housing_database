variables:
  # Direct ACS Detailed Table estimates retained with published 90% MOEs.
  - {variable_id: acs_aggregate_selected_monthly_owner_costs_mortgaged_benchmark, display_name: ACS aggregate selected monthly owner costs - mortgaged owners benchmark, definition: Published aggregate selected monthly owner costs for owner-occupied housing units with a mortgage, provider: U.S. Census Bureau, original_field: B25089_002E/B25089_002M, unit: dollars_per_month, native_frequency: ACS 5-year, final_frequency: ACS 5-year, geography: county, seasonal_adjustment: not applicable, smoothing: none, transformation: direct estimate and published 90% MOE, missing_value_policy: preserve published null or sentinel with flag, revision_policy: archive each ACS vintage, methodological_notes: Retained at the full 60-month source interval.}
  - {variable_id: acs_mortgaged_owner_units_benchmark, display_name: ACS mortgaged owner units benchmark, definition: Published owner-occupied housing units with a mortgage or similar debt, provider: U.S. Census Bureau, original_field: B25081_002E/B25081_002M, unit: housing_units, native_frequency: ACS 5-year, final_frequency: ACS 5-year, geography: county, seasonal_adjustment: not applicable, smoothing: none, transformation: direct estimate and published 90% MOE, missing_value_policy: preserve published null or sentinel with flag, revision_policy: archive each ACS vintage, methodological_notes: Direct count; B25106 is not substituted.}
  - {variable_id: acs_aggregate_owner_value_all_benchmark, display_name: ACS aggregate owner value - all owners benchmark, definition: Published aggregate value of all owner-occupied housing units, provider: U.S. Census Bureau, original_field: B25082_001E/B25082_001M, unit: USD, native_frequency: ACS 5-year, final_frequency: ACS 5-year, geography: county, seasonal_adjustment: not applicable, smoothing: none, transformation: direct estimate and published 90% MOE, missing_value_policy: preserve published null or sentinel with flag, revision_policy: archive each ACS vintage, methodological_notes: Owner-occupied universe.}
  - {variable_id: acs_aggregate_owner_value_mortgaged_benchmark, display_name: ACS aggregate owner value - mortgaged owners benchmark, definition: Published aggregate value of owner-occupied housing units with a mortgage, provider: U.S. Census Bureau, original_field: B25082_002E/B25082_002M, unit: USD, native_frequency: ACS 5-year, final_frequency: ACS 5-year, geography: county, seasonal_adjustment: not applicable, smoothing: none, transformation: direct estimate and published 90% MOE, missing_value_policy: preserve published null or sentinel with flag, revision_policy: archive each ACS vintage, methodological_notes: Universe matched to first-mortgage debt construction.}
  - {variable_id: acs_aggregate_owner_value_no_mortgage_benchmark, display_name: ACS aggregate owner value - mortgage-free owners benchmark, definition: Published aggregate value of owner-occupied housing units without a mortgage, provider: U.S. Census Bureau, original_field: B25082_003E/B25082_003M, unit: USD, native_frequency: ACS 5-year, final_frequency: ACS 5-year, geography: county, seasonal_adjustment: not applicable, smoothing: none, transformation: direct estimate and published 90% MOE, missing_value_policy: preserve published null or sentinel with flag, revision_policy: archive each ACS vintage, methodological_notes: Added only to the all-owner equity measure.}
  - {variable_id: acs_aggregate_household_income_owner_benchmark, display_name: ACS aggregate household income - all owners benchmark, definition: Published aggregate household income for owner-occupied housing units, provider: U.S. Census Bureau, original_field: B25120_002E/B25120_002M, unit: inflation_adjusted_USD_per_year, native_frequency: ACS 5-year, final_frequency: ACS 5-year, geography: county, seasonal_adjustment: not applicable, smoothing: none, transformation: direct estimate and published 90% MOE, missing_value_policy: preserve published null or sentinel with flag, revision_policy: archive each ACS vintage, methodological_notes: Income reference universe retained as published.}
  - {variable_id: acs_aggregate_household_income_mortgaged_owner_benchmark, display_name: ACS aggregate household income - mortgaged owners benchmark, definition: Published aggregate household income for owner-occupied housing units with a mortgage, provider: U.S. Census Bureau, original_field: B25120_003E/B25120_003M, unit: inflation_adjusted_USD_per_year, native_frequency: ACS 5-year, final_frequency: ACS 5-year, geography: county, seasonal_adjustment: not applicable, smoothing: none, transformation: direct estimate and published 90% MOE, missing_value_policy: preserve published null or sentinel with flag, revision_policy: archive each ACS vintage, methodological_notes: Denominator for the mortgage debt-service-to-income benchmark.}
  - {variable_id: acs_aggregate_household_income_no_mortgage_owner_benchmark, display_name: ACS aggregate household income - mortgage-free owners benchmark, definition: Published aggregate household income for owner-occupied housing units without a mortgage, provider: U.S. Census Bureau, original_field: B25120_004E/B25120_004M, unit: inflation_adjusted_USD_per_year, native_frequency: ACS 5-year, final_frequency: ACS 5-year, geography: county, seasonal_adjustment: not applicable, smoothing: none, transformation: direct estimate and published 90% MOE, missing_value_policy: preserve published null or sentinel with flag, revision_policy: archive each ACS vintage, methodological_notes: Retained for audit and comparison.}

  # ACS/PUMS/NMDB finance constructions.
  - {variable_id: pums_first_mortgage_pi_share_applied_benchmark, display_name: Applied PUMS first-mortgage P&I share benchmark, definition: Weighted share of selected monthly owner costs attributable to first-mortgage principal and interest, provider: U.S. Census Bureau, original_field: WGTP/TEN/MRGX/MRGP/MRGT/MRGI/TAXAMT/INSP/SMOCP/ADJHSG, unit: ratio, native_frequency: ACS 5-year PUMS, final_frequency: ACS 5-year, geography: county parameter or California, seasonal_adjustment: not applicable, smoothing: none, transformation: weighted complete-case P&I share, missing_value_policy: preserve missing and use labeled California fallback only when county PUMAs are not wholly contained, revision_policy: archive each PUMS vintage and relationship file, methodological_notes: SMP is excluded from primary first-lien P&I.}
  - {variable_id: acs_estimated_aggregate_monthly_first_mortgage_pi_benchmark, display_name: Estimated aggregate monthly first-mortgage P&I benchmark, definition: ACS aggregate selected owner costs multiplied by the source-period PUMS first-mortgage P&I share, provider: U.S. Census Bureau, original_field: B25089_002 plus PUMS parameter, unit: USD/month, native_frequency: ACS 5-year, final_frequency: ACS 5-year, geography: county, seasonal_adjustment: not applicable, smoothing: none, transformation: source-period multiplication without monthly allocation, missing_value_policy: preserve null when a required parameter is unavailable, revision_policy: archive all source vintages, methodological_notes: The word monthly describes the payment flow unit; the observation remains an ACS-period benchmark.}
  - {variable_id: acs_first_mortgage_pi_per_mortgaged_unit_benchmark, display_name: First-mortgage P&I per mortgaged unit benchmark, definition: Aggregate monthly first-mortgage P&I divided by directly published mortgaged owner units, provider: U.S. Census Bureau, original_field: constructed from B25089/B25081 and PUMS, unit: USD/unit/month, native_frequency: ACS 5-year, final_frequency: ACS 5-year, geography: county, seasonal_adjustment: not applicable, smoothing: none, transformation: matched-period ratio, missing_value_policy: preserve null, revision_policy: archive all source vintages, methodological_notes: No monthly interpolation.}
  - {variable_id: acs_annual_first_mortgage_debt_service_benchmark, display_name: Annual first-mortgage debt service benchmark, definition: Twelve times aggregate monthly first-mortgage P&I, provider: U.S. Census Bureau, original_field: constructed from B25089 and PUMS, unit: USD/year, native_frequency: ACS 5-year, final_frequency: ACS 5-year, geography: county, seasonal_adjustment: not applicable, smoothing: none, transformation: multiply monthly payment unit by twelve, missing_value_policy: preserve null, revision_policy: archive all source vintages, methodological_notes: Annualized payment unit; not an annual point observation.}
  - {variable_id: acs_mortgage_debt_service_to_income_benchmark, display_name: Mortgage debt-service-to-income benchmark, definition: Annualized first-mortgage P&I divided by matched mortgaged-owner aggregate household income, provider: U.S. Census Bureau, original_field: constructed from B25089/B25120 and PUMS, unit: ratio, native_frequency: ACS 5-year, final_frequency: ACS 5-year, geography: county, seasonal_adjustment: not applicable, smoothing: none, transformation: matched-universe ratio, missing_value_policy: preserve null, revision_policy: archive all source vintages, methodological_notes: Source-period benchmark rather than a monthly DSR.}
  - {variable_id: acs_implied_first_mortgage_balance_raw_benchmark, display_name: Raw implied first-mortgage balance benchmark, definition: Fixed-rate-equivalent first-lien balance capitalized from aggregate P&I using a joint NMDB rate-term distribution or labeled PMMS term sensitivity, provider: U.S. Census Bureau/FHFA/Freddie Mac, original_field: constructed, unit: USD, native_frequency: ACS 5-year plus parameter period, final_frequency: ACS 5-year, geography: county with broader parameter geography, seasonal_adjustment: not applicable, smoothing: none, transformation: annuity capitalization, missing_value_policy: preserve null when a joint rate-term parameter is unavailable, revision_policy: archive all source vintages, methodological_notes: PMMS is a fallback origination-rate sensitivity; 20/25/30-year scenarios provide low/central/high.}
  - {variable_id: acs_implied_first_mortgage_balance_cal_benchmark, display_name: California-calibrated implied first-mortgage balance benchmark, definition: Raw county implied balance scaled to a compatible published California outstanding UPB total, provider: U.S. Census Bureau/FHFA, original_field: constructed, unit: USD, native_frequency: ACS 5-year plus NMDB period, final_frequency: ACS 5-year, geography: county calibrated to California, seasonal_adjustment: not applicable, smoothing: none, transformation: ratio calibration across all California counties, missing_value_policy: null with calibration-unavailable flag when compatible California UPB is absent, revision_policy: archive all source vintages, methodological_notes: Never substitutes raw debt for an unavailable calibrated value.}
  - {variable_id: acs_implied_owner_occupied_home_equity_mortgaged_benchmark, display_name: Implied mortgaged-owner home equity benchmark, definition: Published mortgaged-owner aggregate home value less California-calibrated first-mortgage debt, provider: U.S. Census Bureau/FHFA, original_field: B25082_002 less calibrated debt, unit: USD, native_frequency: ACS 5-year plus NMDB period, final_frequency: ACS 5-year, geography: county, seasonal_adjustment: not applicable, smoothing: none, transformation: matched-universe subtraction, missing_value_policy: preserve null when calibrated debt is unavailable, revision_policy: archive all source vintages, methodological_notes: Value and debt universes are matched.}
  - {variable_id: acs_implied_owner_occupied_home_equity_all_benchmark, display_name: Implied all-owner home equity benchmark, definition: Mortgaged-owner equity plus published value of mortgage-free owner housing, provider: U.S. Census Bureau/FHFA, original_field: B25082_002/B25082_003 less calibrated debt, unit: USD, native_frequency: ACS 5-year plus NMDB period, final_frequency: ACS 5-year, geography: county, seasonal_adjustment: not applicable, smoothing: none, transformation: matched-universe identity, missing_value_policy: preserve null when calibrated debt is unavailable, revision_policy: archive all source vintages, methodological_notes: Mortgage-free value enters equity in full.}
  - {variable_id: acs_aggregate_ltv_mortgaged_benchmark, display_name: Aggregate mortgaged-owner LTV benchmark, definition: California-calibrated first-mortgage debt divided by published mortgaged-owner aggregate home value, provider: U.S. Census Bureau/FHFA, original_field: constructed, unit: ratio, native_frequency: ACS 5-year plus NMDB period, final_frequency: ACS 5-year, geography: county, seasonal_adjustment: not applicable, smoothing: none, transformation: matched-universe ratio, missing_value_policy: preserve null when calibrated debt is unavailable, revision_policy: archive all source vintages, methodological_notes: Aggregate ratio; not the mean household LTV.}
  - {variable_id: acs_equity_rate_mortgaged_benchmark, display_name: Mortgaged-owner equity rate benchmark, definition: One minus aggregate mortgaged-owner LTV, provider: U.S. Census Bureau/FHFA, original_field: constructed, unit: ratio, native_frequency: ACS 5-year plus NMDB period, final_frequency: ACS 5-year, geography: county, seasonal_adjustment: not applicable, smoothing: none, transformation: one minus matched aggregate LTV, missing_value_policy: preserve null when calibrated debt is unavailable, revision_policy: archive all source vintages, methodological_notes: Aggregate ratio.}

  # HMDA all-loan and loan-type-specific annual benchmarks.
  - {variable_id: hmda_median_downpayment_rate_benchmark, display_name: HMDA median down-payment rate benchmark, definition: Median one minus reported CLTV for eligible originations, provider: CFPB and FFIEC, original_field: property_value/combined_loan_to_value_ratio, unit: ratio, native_frequency: annual, final_frequency: annual, geography: county, seasonal_adjustment: not seasonally adjusted, smoothing: none, transformation: direct annual aggregation, missing_value_policy: suppress below N=50, revision_policy: archive each official Modified LAR file, methodological_notes: Originated first-lien home-purchase principal-residence loans; cash purchases excluded.}
  - {variable_id: hmda_property_value_weighted_downpayment_rate_benchmark, display_name: HMDA property-value-weighted down-payment rate benchmark, definition: Aggregate CLTV-implied down-payment dollars divided by aggregate valid property value, provider: CFPB and FFIEC, original_field: property_value/combined_loan_to_value_ratio, unit: ratio, native_frequency: annual, final_frequency: annual, geography: county, seasonal_adjustment: not seasonally adjusted, smoothing: none, transformation: direct annual aggregation, missing_value_policy: suppress below N=50, revision_policy: archive each official Modified LAR file, methodological_notes: Missing CLTV is not replaced with loan amount divided by property value.}
  - {variable_id: hmda_aggregate_downpayment_flow_benchmark, display_name: HMDA aggregate down-payment flow benchmark, definition: Sum of CLTV-implied down-payment dollars for eligible originations, provider: CFPB and FFIEC, original_field: property_value/combined_loan_to_value_ratio, unit: USD, native_frequency: annual, final_frequency: annual, geography: county, seasonal_adjustment: not seasonally adjusted, smoothing: none, transformation: direct annual aggregation, missing_value_policy: suppress below N=50, revision_policy: archive each official Modified LAR file, methodological_notes: Mortgage-originations flow; excludes cash purchases.}
  - {variable_id: hmda_share_downpayment_below_3pct_benchmark, display_name: HMDA share below 3% down benchmark, definition: Share of eligible originations with CLTV-implied down payment below 3%, provider: CFPB and FFIEC, original_field: combined_loan_to_value_ratio, unit: ratio, native_frequency: annual, final_frequency: annual, geography: county, seasonal_adjustment: not seasonally adjusted, smoothing: none, transformation: direct annual share, missing_value_policy: suppress below N=50, revision_policy: archive each official Modified LAR file, methodological_notes: All eligible reported loan types.}
  - {variable_id: hmda_share_downpayment_below_5pct_benchmark, display_name: HMDA share below 5% down benchmark, definition: Share of eligible originations with CLTV-implied down payment below 5%, provider: CFPB and FFIEC, original_field: combined_loan_to_value_ratio, unit: ratio, native_frequency: annual, final_frequency: annual, geography: county, seasonal_adjustment: not seasonally adjusted, smoothing: none, transformation: direct annual share, missing_value_policy: suppress below N=50, revision_policy: archive each official Modified LAR file, methodological_notes: All eligible reported loan types.}
  - {variable_id: hmda_share_downpayment_below_10pct_benchmark, display_name: HMDA share below 10% down benchmark, definition: Share of eligible originations with CLTV-implied down payment below 10%, provider: CFPB and FFIEC, original_field: combined_loan_to_value_ratio, unit: ratio, native_frequency: annual, final_frequency: annual, geography: county, seasonal_adjustment: not seasonally adjusted, smoothing: none, transformation: direct annual share, missing_value_policy: suppress below N=50, revision_policy: archive each official Modified LAR file, methodological_notes: All eligible reported loan types.}
  - {variable_id: hmda_share_downpayment_below_20pct_benchmark, display_name: HMDA share below 20% down benchmark, definition: Share of eligible originations with CLTV-implied down payment below 20%, provider: CFPB and FFIEC, original_field: combined_loan_to_value_ratio, unit: ratio, native_frequency: annual, final_frequency: annual, geography: county, seasonal_adjustment: not seasonally adjusted, smoothing: none, transformation: direct annual share, missing_value_policy: suppress below N=50, revision_policy: archive each official Modified LAR file, methodological_notes: All eligible reported loan types.}

