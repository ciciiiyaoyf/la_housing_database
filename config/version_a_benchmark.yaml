database_version: "A. Benchmark"
benchmark_suffix: "_benchmark"
output_geography: county
state_fips: "06"
primary_county_fips: "06037"
preserve_native_frequency: true
permit_monthly_interpolation: false
permit_nowcasts: false
missing_value_policy: preserve_with_explicit_quality_flag

required_metadata_fields:
  - county_fips
  - month
  - value
  - variable_name
  - database_version
  - source_frequency
  - source_period_start
  - source_period_end
  - reference_date
  - release_date
  - source_release_dates
  - source_id
  - source_vintage
  - retrieved_at
  - source_filename
  - checksum_sha256
  - source_geography
  - parameter_geography
  - monthly_method
  - is_modeled
  - is_nowcast
  - is_imputed
  - is_interpolated
  - benchmark_vintage
  - sample_n
  - coverage_rate
  - low_estimate
  - central_estimate
  - high_estimate
  - universe_definition
  - notes
  - transformation_id
  - lineage_id

sources:
  census_acs5_finance:
    provider: U.S. Census Bureau
    implementation_status: implemented
    acquisition: official_api_or_table_based_summary_file
    acquisition_selection: api_when_census_api_key_set_else_summary_file
    source_page_url: https://www.census.gov/data/developers/data-sets/acs-5year.html
    api_url_template: https://api.census.gov/data/{year}/acs/acs5
    summary_file_source_page_url: https://www.census.gov/programs-surveys/acs/data/summary-file.html
    summary_file_first_verified_vintage: 2022
    summary_file_table_url_template: https://www2.census.gov/programs-surveys/acs/summary_file/{year}/table-based-SF/data/5YRData/acsdt5y{year}-{table_id_lower}.dat
    summary_file_geography_url_template: https://www2.census.gov/programs-surveys/acs/summary_file/{year}/table-based-SF/documentation/Geos{year}5YR.txt
    summary_file_archive_format: acs_finance_benchmark_summary_file_zip_v1
    native_frequency: acs_5_year
    geography: california_counties
    first_supported_vintage: 2009
    latest_verified_vintage: 2024
    groups: [B01003, B25089, B25081, B25082, B25120]
    fields:
      B01003_001: acs_total_population_benchmark
      B25089_002: acs_aggregate_selected_monthly_owner_costs_mortgaged_benchmark
      B25081_001: acs_owner_occupied_units_benchmark
      B25081_002: acs_mortgaged_owner_units_benchmark
      B25082_001: acs_aggregate_owner_value_all_benchmark
      B25082_002: acs_aggregate_owner_value_mortgaged_benchmark
      B25082_003: acs_aggregate_owner_value_no_mortgage_benchmark
      B25120_002: acs_aggregate_household_income_owner_benchmark
      B25120_003: acs_aggregate_household_income_mortgaged_owner_benchmark
      B25120_004: acs_aggregate_household_income_no_mortgage_owner_benchmark
    notes: With CENSUS_API_KEY, use the official API; otherwise verified 2022+ vintages use the five exact table-based Summary File data files plus the matching geography-label file in one immutable ZIP archive. Older vintages require an API key. B25081_002 is the directly published owner-units-with-mortgage count. B25106 is optional validation, not the primary balance method. Census rounds each aggregate-dollar matrix cell independently to the nearest $100, so B25082/B25120 partition QA permits only a $100 rounding discrepancy while retaining every published value unchanged.

  census_acs5_pums_housing_ca:
    provider: U.S. Census Bureau
    implementation_status: implemented
    acquisition: official_bulk_zip
    source_page_url: https://www.census.gov/programs-surveys/acs/microdata/access.html
    download_url_template: https://www2.census.gov/programs-surveys/acs/data/pums/{year}/5-Year/csv_hca.zip
    native_frequency: acs_5_year
    geography: puma_and_california
    first_supported_vintage: 2016
    latest_verified_vintage: 2024
    supported_relationship_vintages:
      2016-2021: 2010
      2022-2024: 2020
    rejected_dual_puma_vintages: [2012, 2013, 2014, 2015]
    transition_vintage_2022: require_official_single_2020_puma_update
    required_columns:
      [WGTP, TEN, MRGX, MRGP, MRGT, MRGI, SMP, TAXAMT, INSP, SMOCP, ADJHSG, PUMA]
    replicate_weight_columns: WGTP1-WGTP80_all_or_none
    uncertainty_method: acs_successive_difference_replication_90_percent_moe
    parameter_hierarchy: complete_county_pool_then_connected_puma_region_then_california
    notes: County and regional parameters pool records with WGTP; ratios are never averaged across counties. Official WGTP1-WGTP80 weights produce SDR uncertainty and partial replicate sets are rejected. SMP is an ADJHSG-adjusted monthly payment per eligible mortgaged PUMS unit and is excluded from primary first-lien debt and equity.

  census_tract_to_puma_2020:
    provider: U.S. Census Bureau
    implementation_status: implemented
    acquisition: official_relationship_file
    download_url: https://www2.census.gov/geo/docs/maps-data/data/rel2020/2020_Census_Tract_to_2020_PUMA.txt
    native_frequency: decennial_crosswalk
    geography: tract_to_puma

  census_tract_to_puma_2010:
    provider: U.S. Census Bureau
    implementation_status: implemented
    acquisition: official_relationship_file
    download_url: https://www2.census.gov/geo/docs/maps-data/data/rel/2010_Census_Tract_to_2010_PUMA.txt
    native_frequency: decennial_crosswalk
    geography: tract_to_puma

  cfpb_hmda_modified_lar:
    provider: CFPB and FFIEC
    implementation_status: manual_required
    acquisition: official_combined_file_import
    source_page_url: https://ffiec.cfpb.gov/data-publication/modified-lar
    native_frequency: annual
    geography: loan_record_with_county
    first_supported_vintage: 2018
    required_columns:
      - activity_year
      - state_code
      - county_code
      - action_taken
      - loan_purpose
      - occupancy_type
      - lien_status
      - loan_type
      - property_value
      - combined_loan_to_value_ratio
    notes: The repository does not invent a stable bulk URL. Import the official combined Modified LAR CSV or ZIP and preserve its checksum.

  fhfa_nmdb_joint_distribution:
    provider: Federal Housing Finance Agency
    implementation_status: manual_required
    acquisition: official_dashboard_export
    source_page_url: https://www.fhfa.gov/data/dashboard/nmdb-outstanding-residential-mortgage-statistics
    native_frequency: quarterly_or_published_aggregate
    geography: united_states_or_published_parameter_geography
    required_parameter: joint_outstanding_rate_remaining_term_distribution
    reference_compatibility: exact_benchmark_vintage_and_reference_date
    notes: Never manufacture a joint distribution from separate marginals. Normalized rows retain this distinct source ID and complete file/release provenance.

  fhfa_nmdb_ca_upb:
    provider: Federal Housing Finance Agency
    implementation_status: manual_required
    acquisition: official_dashboard_export
    source_page_url: https://www.fhfa.gov/data/dashboard/nmdb-outstanding-residential-mortgage-statistics
    native_frequency: quarterly_or_published_aggregate
    geography: california
    required_parameter: universe_compatible_california_unpaid_principal_balance
    reference_compatibility: exact_benchmark_vintage_and_reference_date
    required_compatibility_evidence:
      - control_type_unpaid_principal_balance
      - compatible_with_county_debt_true
      - explicit_universe_definition
      - normalized_source_provenance
    notes: Bare benchmark-to-value mappings are rejected. Calibrated county debt stays null without one exact-date compatible provenance-rich California control.

  freddie_mac_pmms:
    provider: Freddie Mac
    implementation_status: implemented_fallback_only
    acquisition: official_csv
    source_page_url: https://www.freddiemac.com/pmms/pmms_archives
    native_frequency: weekly
    outputs:
      - mortgage_rate_30y_weekly
      - mortgage_rate_30y_monthly_average
      - mortgage_rate_30y_monthly_median
      - mortgage_rate_30y_month_end
    notes: Sensitivity fallback only; it is an origination-rate series, not the preferred outstanding-stock coupon.

  bls_cpi_u_us_city_average:
    provider: U.S. Bureau of Labor Statistics
    implementation_status: implemented
    acquisition: official_stable_flat_file_or_local_official_snapshot
    source_page_url: https://www.bls.gov/cpi/data.htm
    download_url: https://download.bls.gov/pub/time.series/cu/cu.data.1.AllItems
    native_frequency: monthly_with_published_annual_average
    geography: united_states_city_average
    series_id: CUUR0000SA0
    annual_average_period: M13
    constant_dollar_base_year: 2024
    release_date_policy: explicit_required
    notes: Select the published M13 annual average. Never recompute it from monthly values. ACS dollar estimates use the ACS vintage ending year as their price basis, not the five-year midpoint.

