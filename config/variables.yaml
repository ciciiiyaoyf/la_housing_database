- variable_id: net_change_occupied_apartments_annual
  display_name: ACS renter-occupied units vintage-to-vintage change
  definition: Difference between consecutive annual ACS B25003 five-year estimates of renter-occupied units for Los Angeles County.
  provider: Constructed from U.S. Census Bureau ACS
  original_field: B25003_003E consecutive-vintage difference
  unit: housing_units
  native_frequency: annual_5_year_estimate vintage difference
  final_frequency: annual
  geography: county
  seasonal_adjustment: not applicable
  smoothing: overlapping five-year survey windows
  transformation: Current ACS renter-occupied estimate minus the immediately prior ending-year estimate only when vintages are consecutive.
  missing_value_policy: preserve null when either vintage is missing or ending years are not consecutive
  revision_policy: recompute when an ACS vintage is refreshed
  methodological_notes: B25003 covers all renter-occupied housing units, not a literal multifamily-apartment universe. Adjacent ACS five-year vintages overlap for four survey years. This constructed point difference is not an observed one-year flow, is not a significance test, and is never expanded or relabeled as quarterly. Published current/prior margins of error remain available in the annual controls; no naive independent-MOE propagation is applied to overlapping samples.
  observed_constructed_proxy_or_scenario: proxy
  is_observed: false
  is_constructed: true
  is_proxy: true
- variable_id: county_annual_price_to_income_acs
  display_name: ACS county annual price-to-income ratio
  definition: Matched-vintage ACS B25077 median home value divided by ACS B19013 median household income for Los Angeles County.
  provider: Constructed from U.S. Census Bureau ACS
  original_field: B25077_001E / B19013_001E
  unit: ratio
  native_frequency: annual_5_year_estimate
  final_frequency: annual
  geography: county
  seasonal_adjustment: not applicable
  smoothing: overlapping five-year survey windows
  transformation: Match B25077 and B19013 on Los Angeles County and exact ACS ending year, then divide nonnegative median home value by positive median household income.
  missing_value_policy: preserve null when either published source estimate is null or invalid, or household income is nonpositive
  revision_policy: recompute from matched archived ACS vintages
  methodological_notes: This is an annual ratio of matched ACS five-year estimates. It is a panel-only construction, not a fact observation, and is never interpolated, allocated, or relabeled as quarterly or monthly.
  observed_constructed_proxy_or_scenario: constructed
  is_observed: false
  is_constructed: true
  is_proxy: false
- variable_id: zcta_annual_price_to_income_acs
  display_name: ACS ZCTA annual price-to-income ratio
  definition: Matched-vintage ACS B25077 median home value divided by ACS B19013 median household income for the same Census ZCTA.
  provider: Constructed from U.S. Census Bureau ACS
  original_field: B25077_001E / B19013_001E
  unit: ratio
  native_frequency: annual_5_year_estimate
  final_frequency: annual
  geography: zcta
  seasonal_adjustment: not applicable
  smoothing: overlapping five-year survey windows
  transformation: Match B25077 and B19013 on exact Census ZCTA and ACS ending year, then divide median home value by positive median household income.
  missing_value_policy: preserve null when either published source estimate is null or invalid, or household income is nonpositive
  revision_policy: recompute from matched archived ACS vintages
  methodological_notes: This is an annual ratio of matched ACS five-year estimates for Census ZIP Code Tabulation Areas. It is not a USPS postal-ZIP observation, is not interpolated, and is never expanded or relabeled as quarterly.
  observed_constructed_proxy_or_scenario: constructed
  is_observed: false
  is_constructed: true
  is_proxy: false
- variable_id: zcta_renter_occupied_units_vintage_change_annual
  display_name: ACS ZCTA renter-occupied units vintage-to-vintage change
  definition: Difference between consecutive annual ACS B25003 five-year estimates of renter-occupied units within the same Census ZCTA.
  provider: Constructed from U.S. Census Bureau ACS
  original_field: B25003_003E consecutive-vintage difference
  unit: housing_units
  native_frequency: annual_5_year_estimate vintage difference
  final_frequency: annual
  geography: zcta
  seasonal_adjustment: not applicable
  smoothing: overlapping five-year survey windows
  transformation: Within each exact Census ZCTA, subtract the immediately prior B25003 ending-year estimate only when the two published vintages are consecutive.
  missing_value_policy: preserve null when either vintage is missing or ending years are not consecutive
  revision_policy: recompute when an archived ACS vintage is refreshed
  methodological_notes: B25003 covers all renter-occupied housing units, not a literal multifamily-apartment universe. Adjacent ACS five-year vintages overlap for four survey years. The result is a vintage-to-vintage difference, not an observed one-year or quarterly flow, and the Census ZCTA is never relabeled as a postal ZIP. Published current and prior MOEs remain in the annual panel; no naive independent-MOE propagation is applied to overlapping samples.
  observed_constructed_proxy_or_scenario: proxy
  is_observed: false
  is_constructed: true
  is_proxy: true
