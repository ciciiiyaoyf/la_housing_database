  definition: Scenario closing costs equal to 5 percent of the matched Redfin median sale price.
  provider: Constructed from Redfin Data Center
  original_field: median_sale_price * 0.05
  unit: current_dollars
  native_frequency: derived from monthly county or rolling-three-month ZIP price
  final_frequency: monthly
  geography: county|postal_zip
  seasonal_adjustment: not applicable
  smoothing: inherited from source price
  transformation: multiply the positive matched sale-price level by 0.05
  missing_value_policy: preserve null when the source price is missing or nonpositive
  revision_policy: recompute when the archived Redfin input updates
  methodological_notes: Canonical high sale-price-based scenario. Postal-ZIP values inherit Redfin Key Metrics overlapping rolling-three-month frequency and are not single-month sale-price observations.
  observed_constructed_proxy_or_scenario: scenario assumption
  is_observed: false
  is_constructed: true
  is_proxy: false
- variable_id: estimated_mortgage_amount_scenario
  display_name: Estimated mortgage amount scenario
  definition: Positive Redfin median sale price multiplied by one minus the explicitly keyed down-payment share.
  provider: Constructed from Redfin Data Center
  original_field: median_sale_price * (1 - down_payment_share)
  unit: current_dollars
  native_frequency: scenario layer
  final_frequency: monthly
  geography: county|postal_zip
  seasonal_adjustment: not applicable
  smoothing: inherited from source price
  transformation: retain all configured 3.5%, 10%, and 20% down-payment scenarios as separate rows
  missing_value_policy: preserve null or omit scenario row when source price is missing or nonpositive
  revision_policy: recompute when inputs or documented scenario assumptions update
  methodological_notes: Scenario principal only; not an observed origination balance. Postal-ZIP rows retain the source rolling-three-month price label.
  observed_constructed_proxy_or_scenario: scenario assumption
  is_observed: false
  is_constructed: true
  is_proxy: false
