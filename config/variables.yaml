- variable_id: acs_rental_availability_rate
  display_name: ACS county rental-availability rate proxy
  definition: ACS for-rent vacant units divided by renter-occupied units plus for-rent vacant units.
  provider: Constructed from U.S. Census Bureau ACS
  original_field: B25004_E002 / (B25003_E003 + B25004_E002)
  unit: ratio
  native_frequency: annual_5_year_estimate
  final_frequency: annual
  geography: county
  seasonal_adjustment: not applicable
  smoothing: five-year pooled survey inputs
  transformation: >-
    Match B25003 and B25004 on county and ACS ending year, then calculate
    for_rent_vacant / (renter_occupied + for_rent_vacant).
  missing_value_policy: >-
    Preserve null when an estimate or component MOE is missing or negative, the
    denominator is nonpositive, or either component 90% MOE is at least its estimate.
  revision_policy: recompute from matched archived ACS vintages
  methodological_notes: >-
    Annual renter-market availability proxy required by the current methodology.
    Component estimates and published MOEs remain in the fact table, and the county
    panel carries an explicit quality flag. This is neither observed monthly active
    rental-listing inventory nor the HUD-USPS all-residential vacancy proxy.
  observed_constructed_proxy_or_scenario: proxy
  is_observed: false
  is_constructed: true
  is_proxy: true
  active_status: Active
