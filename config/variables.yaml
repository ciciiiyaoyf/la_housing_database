variables:
- variable_id: zhvi
  display_name: Zillow Home Value Index
  definition: Typical home value for the 35th-65th percentile
  provider: Zillow Research
  original_field: value
  unit: USD
  native_frequency: monthly
  final_frequency: monthly
  geography: county|postal_zip
  seasonal_adjustment: seasonally adjusted
  smoothing: smoothed
  transformation: wide-to-long and month-end normalization
  missing_value_policy: preserve null
  revision_policy: archive every retrieval
  methodological_notes: Middle-tier all-homes ZHVI product.
- variable_id: zori_smoothed_sa
  display_name: Zillow Observed Rent Index - smoothed seasonally adjusted
  definition: Typical observed market-rate rent for all homes plus multifamily with smoothing and seasonal adjustment
  provider: Zillow Research
  original_field: value
  unit: USD/month
  native_frequency: monthly
  final_frequency: monthly
  geography: county|postal_zip
  seasonal_adjustment: seasonally adjusted
  smoothing: smoothed
  transformation: wide-to-long and month-end normalization
  missing_value_policy: preserve null without substitution
  revision_policy: archive every retrieval
  methodological_notes: Sole active rent index; exposed as zori in analytical panels.
- variable_id: redfin_zip_homes_sold_rolling_3m
