- variable_id: acs_implied_aggregate_mortgage_debt_proxy
  display_name: ACS implied aggregate mortgage debt proxy
  definition: Constructed proxy for aggregate outstanding mortgage debt inferred from ACS B25106 owner income/cost-burden
    bins, ACS B25081 owner-with-mortgage counts, and Freddie Mac rate assumptions.
  provider: Constructed
  original_field: constructed
  unit: USD
  native_frequency: derived
  final_frequency: annual
  geography: county
  seasonal_adjustment: not applicable
  smoothing: none
  transformation: Allocate B25081 owner-with-mortgage counts across B25106 positive-income owner cost-burden bins, infer monthly
    debt service from bin income and burden midpoints, then convert payment to balance with a fixed-rate amortization formula.
