  display_name: ACS owner-occupied housing value proxy
  definition: ACS owner-occupied housing units multiplied by ACS median home value; partial input for the aggregate home-equity
    workaround, not net equity.
  provider: Constructed
  original_field: constructed
  unit: USD
  native_frequency: derived
  final_frequency: annual
  geography: county
  seasonal_adjustment: not applicable
  smoothing: none
  transformation: ACS owner-occupied housing units multiplied by ACS median home value.
