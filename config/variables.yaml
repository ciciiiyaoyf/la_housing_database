- variable_id: noncontrolled_exposure_share_structural_proxy_lower_bound
  display_name: "Noncontrolled rental exposure structural proxy lower bound"
  definition: "Beginning with the 2020 ACS observation, the B25127 definitely-recent construction share used as a lower-bound structural proxy for potentially noncontrolled renter exposure."
  provider: Constructed from U.S. Census Bureau ACS
  original_field: "acs_b25127_renter_recent_lower_bound_total / acs_b25127_renter_total when observation year is 2020 or later"
