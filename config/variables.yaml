  revision_policy: "recompute from same-vintage archived ACS inputs"
  methodological_notes: "The published B25127 bins cannot identify an exact rolling 15-year construction cutoff. The lower bound includes only the definitely-recent bin; its calendar meaning changes with published ACS vintage regimes. This is an annual structural proxy bound, not a legal eligibility estimate, and it is never expanded to months."
