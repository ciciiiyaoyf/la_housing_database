- variable_id: ahs_ca_reported_case_primary_mortgage_outstanding_principal_proxy
  display_name: AHS California reported-case primary-mortgage outstanding-principal proxy
  definition: Sum of fourteen reported principal-balance-bin household estimates times the published conditional mean.
  provider: Constructed from U.S. Census Bureau and HUD AHS
  original_field: sum(14 reported-bin estimates) * 1,000 * Mean (dollars)
  unit: current_dollars
  native_frequency: biennial_survey_year
  final_frequency: annual
  geography: state
  seasonal_adjustment: not applicable
  smoothing: none
  missing_value_policy: fail on missing, suppressed, nonnumeric, reordered, or unreconciled required Table Creator cells
  revision_policy: rebuild from each immutable checksummed official export
  source_geography: California
  source_frequency: biennial_survey_year
  model_frequency: annual
  active_status: Active
  transformation: Sum fourteen reported-bin estimates in thousands, multiply by 1,000, then multiply by the published conditional mean.
  methodological_notes: Authorized by the Four Variable Data Status Report as the primary public AHS calibration proxy, not the exact owner-occupied closed-end first-lien control. It excludes unreported balances, has no covariance-based aggregate standard error or confidence interval, is 2023 statewide only, and cannot silently calibrate 2024 county targets. Survey-designated primary mortgage may not equal legal first lien.
  market_segment: Homeowner
  variable_role: Sensitivity benchmark
  data_domain: housing_finance
  is_observed: false
  is_constructed: true
  is_proxy: true
  observed_constructed_proxy_or_scenario: constructed reported-case public calibration proxy
