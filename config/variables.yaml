- variable_id: acs_renter_recent_construction_share_lower_bound
  display_name: "ACS renter occupied recent-construction share lower bound"
  definition: "Lower bound on the renter-occupied share in a recent year-built band, using only B25127 units definitely inside the available recent bin."
  provider: Constructed from U.S. Census Bureau ACS
