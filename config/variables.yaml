- variable_id: noncontrolled_exposure_share_structural_proxy_upper_bound
  display_name: "Noncontrolled rental exposure structural proxy upper bound"
  definition: "Beginning with the 2020 ACS observation, an upper-bound structural proxy that unions renter units in the broad recent-construction band with all remaining B25032 one-unit renter units."
  provider: Constructed from U.S. Census Bureau ACS
  original_field: "min(1, (acs_b25127_renter_recent_lower_bound_total + acs_b25127_renter_cutoff_mixed_total + acs_b25032_renter_1_detached + acs_b25032_renter_1_attached - acs_b25127_renter_recent_lower_bound_1_unit - acs_b25127_renter_cutoff_mixed_1_unit) / acs_b25127_renter_total) when observation year is 2020 or later"
  unit: ratio
  native_frequency: annual_5_year_estimate
  final_frequency: annual
  geography: county|zcta
  seasonal_adjustment: not applicable
  smoothing: overlapping five-year survey windows
  transformation: "union the broad B25127 recent-construction band with B25032 one-unit renter structures, subtract one-unit cells already in the age bands to avoid double counting, cap at one, and preserve null before 2020"
  missing_value_policy: "preserve null when any required estimate is missing, invalid, or the denominator is nonpositive"
  revision_policy: "recompute from same-vintage archived ACS inputs"
  methodological_notes: "This deliberately broad upper proxy treats all remaining one-unit rentals as potentially exempt even though ACS does not observe the required ownership and notice conditions. It is not proof that a unit is legally exempt or noncontrolled and does not encode local ordinances, affordable-housing, or other exemptions. Exact noncontrolled_exposure_share remains absent pending a complete dated policy and exemption crosswalk. Annual values are not expanded to months; Census ZCTAs are not USPS postal ZIPs."
