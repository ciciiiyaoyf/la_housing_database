schema_version: 1
database_version: "B. Retrospective monthly"
config_version: version_b_monthly_hist_v1
output_frequency: monthly
output_id_suffix: _monthly_hist
contract:
  description: >-
    Closed variable dictionary for the retrospective Version B builder. All
    rows are modeled historical observations, never nowcasts. Canonical
    targets that lack a method-compliant public input remain explicit nulls;
    proxies and PMMS sensitivities use separate identifiers.
  output_statuses:
    - canonical_modeled_repeat
    - canonical_null
    - proxy
    - scenario
  canonical_null_policy: >-
    Never populate canonical monthly financed-purchase flow, calibrated debt,
    or calibrated equity with a Redfin proxy or PMMS sensitivity.

